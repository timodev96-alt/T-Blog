{% extends 'base.html' %}

{% block title %}
{{ post.title }}
{% endblock %}

{% block content  %}
<div class="row justify-content-center my-4">
    <div class="col-md-9">
        <h1 class="mb-2">{{ post.title }}</h1>
        <p class="text-muted mb-4">⏱{{ reading_time }} min read</p>
        
        <div class="post-body mb-5">{{ rendered_body | safe }}</div>

        <hr>

        <div class="d-flex gap-2">
            <a href="/" class="btn btn-outline-secondary">&larr; All Posts</a>
            <a href="{{ url_for('Blog.update', post_id=post['id']) }}" class="btn btn-primary">Edit Post</a>
            <form action="{{ url_for('Blog.delete', post_id=post['id'])}}" method="POST" onsubmit="return confirm('Delete this post?');">
                <button type="submit" class="btn btn-danger">Delete</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
