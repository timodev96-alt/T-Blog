<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@300;400;700&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap.min.css')}}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css')}}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container">
    <a class="navbar-brand" href="/posts">T-Blog</a>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" href="{{url_for('Blog.create')}}">Create post</a>
        </li>
        <li class="nav-item">
        <button id="theme-toggle" class="btn btn-outline-secondary btn-sm">Dark</button>
        </li>
      </ul>
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        {% if g.user %}
        <li class="nav-item">
            <span class="nav-link text-dark"><strong>{{g.user['username']}}</strong></span>
        </li>
        <li class="nav-item">
            <a class="nav-link active" href="/logout">Logout</a>
        </li>
        {% else %}
        <li class="nav-item">
            <a class="nav-link active" href="/login">Login</a>
        </li>
        <li class="nav-item">
            <a class="nav-link active" href="/register">Register</a>
        </li>
        {% endif %}
    </div>
  </div>
</nav>
  
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <script>
    (function(){
        const btn = document.getElementById('theme-toggle');
        const saved = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', saved);
        btn.textContent = saved === 'dark'? 'Light': 'Dark';

        btn.addEventListener('click',()=>{
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark'? 'light':'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            btn.textContent = next ==='dark'? 'light' : 'dark';
        });
    })();
</script>
    
</body>
</html>
