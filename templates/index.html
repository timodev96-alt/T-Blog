{% extends 'base.html' %}

{% block title %}T-Blog{% endblock %}
{% block content %}

{% if posts%}
<h1>All Posts</h1>
{% else %}
<h1>No Posts yet!</h1>
{% endif %}
<ul>
    {% for post in posts %}
        <li>
            <a href="{{ url_for('show', post_id=post.id) }}">{{ post.title}}</a>
        </li>
    {% endfor %}
</ul>
{% endblock %}
